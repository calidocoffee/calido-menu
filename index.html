<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calido Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
        }
        h2 { margin-top: 0; font-size: 22px; margin-bottom: 15px; }
        
        /* Зафиксированная горизонтальная лента разделов */
        .categories {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--tg-theme-bg-color, #ffffff);
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 10px 0;
            margin-bottom: 15px;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Карточки товаров в общем списке */
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
            cursor: pointer;
        }
        .item img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .item-info { flex-grow: 1; padding-right: 10px; }
        .item-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: block; }
        .item-desc { font-size: 12px; color: var(--tg-theme-hint-color, #888); margin-bottom: 6px; display: block; }
        .item-price { font-weight: 600; font-size: 15px; display: block; }
        
        .open-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 18px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .open-btn.in-cart {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Модальное окно карточки товара (шторка снизу) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            width: 100%;
            max-height: 88vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }
        .modal-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 12px;
        }
        .modal-title { font-size: 20px; font-weight: bold; margin: 0 0 6px 0; }
        .modal-desc { font-size: 13px; color: var(--tg-theme-hint-color, #777); margin-bottom: 10px; line-height: 1.4; }
        
        .kbju-box {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .kbju-box strong { color: var(--tg-theme-text-color, #000); }

        /* Секции модификаторов в карточке */
        .mod-section { margin-bottom: 16px; }
        .mod-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .chip.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        .mod-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .mod-row-title { font-size: 14px; font-weight: 600; }
        .mod-row-sub { font-size: 11px; color: var(--tg-theme-hint-color, #888); display: block; }

        /* Кнопки плюс и минус */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ctrl-btn {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000);
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn.plus {
            background-color: #3e2723;
            color: #ffffff;
            border-color: #3e2723;
        }
        .item-count {
            font-weight: bold;
            font-size: 15px;
            min-width: 18px;
            text-align: center;
        }

        .add-modal-btn {
            width: 100%;
            background-color: #3e2723;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Экран оформления и корзины */
        #checkout { display: none; }
        .checkout-block {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            font-size: 15px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--tg-theme-link-color, #3390ec);
            font-size: 16px;
            padding: 0;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
        }
        .cart-item-info { flex-grow: 1; padding-right: 10px; }
        .cart-item-title { font-size: 14px; font-weight: 600; display: block; margin-bottom: 3px; }
        .cart-item-price { font-size: 13px; color: var(--tg-theme-hint-color, #777); }

        let cart = {};
        let currentView = 'menu';
        let currentCategory = 'all';
        let modalState = null;

        function getAltMilkExtra(sizeStr) {
            if (sizeStr.includes('200')) return 80;
            if (sizeStr.includes('300')) return 100;
            if (sizeStr.includes('400')) return 120;
            return 0;
        }

        function getProductCartCount(prodId) {
            let sum = 0;
            for (let key in cart) {
                if (cart[key].prodId === prodId) sum += cart[key].count;
            }
            return sum;
        }

        function renderItems(category) {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            products.forEach(p => {
                if (category === 'all' || p.category === category) {
                    let minPrice = p.variants[0].price;
                    let priceLabel = p.variants.length > 1 ? `от ${minPrice} ₽` : `${minPrice} ₽`;
                    let sizesHint = p.variants[0].size ? p.variants.map(v => v.size).join(' / ') : (p.desc || '');
                    
                    let inCartCount = getProductCartCount(p.id);
                    let btnText = inCartCount > 0 ? `Выбрано: ${inCartCount}` : 'Выбрать';
                    let btnClass = inCartCount > 0 ? 'open-btn in-cart' : 'open-btn';

                    container.innerHTML += `
                        <div class="item" onclick="openProductModal('${p.id}')">
                            <img src="${p.img}">
                            <div class="item-info">
                                <span class="item-title">${p.title}</span>
                                <span class="item-desc">${sizesHint}</span>
                                <span class="item-price">${priceLabel}</span>
                            </div>
                            <button class="${btnClass}">${btnText}</button>
                        </div>
                    `;
                }
            });
        }

        function filter(category, event) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderItems(category);
        }

        function openProductModal(prodId) {
            let p = products.find(item => item.id === prodId);
            modalState = {
                prodId: p.id,
                varIdx: 0,
                milk: 'Обычное',
                syrup: 'Без сиропа',
                bumbleSyrup: 'С сиропом',
                temp: 'Со льдом',
                cinnamon: false,
                sugar: 0
            };
            renderModalContent();
            document.getElementById('product-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.remove('active');
            modalState = null;
        }

        function closeModalOnBg(event) {
            if (event.target.id === 'product-modal') closeModal();
        }

        function calcCurrentModalPrice() {
            let p = products.find(item => item.id === modalState.prodId);
            let activeVar = p.variants[modalState.varIdx];
            let price = activeVar.price;

            if (HAS_ALT_MILK.includes(p.id) && modalState.milk !== 'Обычное') {
                price += getAltMilkExtra(activeVar.size);
            }
            if (HAS_SYRUP_LIST.includes(p.id) && modalState.syrup !== 'Без сиропа') {
                price += SYRUP_PRICE;
            }
            return price;
        }

        function renderModalContent() {
            let p = products.find(item => item.id === modalState.prodId);
            let activeVar = p.variants[modalState.varIdx];
            let isDrink = DRINK_CATEGORIES.includes(p.category);
            let html = '';

            html += `<img class="modal-img" src="${p.img}">`;
            html += `<h3 class="modal-title">${p.title}</h3>`;
            if (p.desc) html += `<div class="modal-desc">${p.desc}</div>`;

            let compText = p.comp || 'Уточняйте у бариста';
            let kbjuText = p.kbju || 'КБЖУ уточняется';
            html += `
                <div class="kbju-box">
                    <strong>Состав:</strong> ${compText}<br>
                    <strong>Пищевая ценность:</strong> ${kbjuText}
                </div>
            `;

            // 1. Выбор объема
            if (p.variants.length > 1) {
                let btns = p.variants.map((v, idx) => 
                    `<button class="chip ${idx === modalState.varIdx ? 'active' : ''}" onclick="setModalVar(${idx})">${v.size} • ${v.price} ₽</button>`
                ).join('');
                html += `<div class="mod-section"><span class="mod-title">Объем</span><div class="chips">${btns}</div></div>`;
            }

            // 2. Выбор молока
            if (HAS_ALT_MILK.includes(p.id)) {
                let extra = getAltMilkExtra(activeVar.size);
                let btns = MILK_LIST.map(m => {
                    let label = m === 'Обычное' ? m : `${m} (+${extra} ₽)`;
                    return `<button class="chip ${modalState.milk === m ? 'active' : ''}" onclick="setModalProp('milk', '${m}')">${label}</button>`;
                }).join('');
                html += `<div class="mod-section"><span class="mod-title">Молоко</span><div class="chips">${btns}</div></div>`;
            }

            // 3. Выбор одного сиропа (+30 ₽)
            if (HAS_SYRUP_LIST.includes(p.id)) {
                let opts = SYRUPS_LIST.map(s => {
                    let label = s === 'Без сиропа' ? s : `${s} (+${SYRUP_PRICE} ₽)`;
                    return `<option value="${s}" ${modalState.syrup === s ? 'selected' : ''}>${label}</option>`;
                }).join('');
                html += `
                    <div class="mod-section">
                        <span class="mod-title">Сироп (можно выбрать один)</span>
                        <select onchange="setModalProp('syrup', this.value)">${opts}</select>
                    </div>
                `;
            }

            // 4. Модификаторы для Бамбла и Матча-апельсин
            if (HAS_BUMBLE_MODS.includes(p.id)) {
                let sBtns = ['С сиропом', 'Без сиропа'].map(s => 
                    `<button class="chip ${modalState.bumbleSyrup === s ? 'active' : ''}" onclick="setModalProp('bumbleSyrup', '${s}')">${s}</button>`
                ).join('');
                html += `<div class="mod-section"><span class="mod-title">Сироп</span><div class="chips">${sBtns}</div></div>`;

                let tBtns = ['Горячий', 'Со льдом', 'Без льда'].map(t => 
                    `<button class="chip ${modalState.temp === t ? 'active' : ''}" onclick="setModalProp('temp', '${t}')">${t}</button>`
                ).join('');
                html += `<div class="mod-section"><span class="mod-title">Температура</span><div class="chips">${tBtns}</div></div>`;
            }

            // 5. Бесплатная корица (+Корица)
            if (HAS_CINNAMON.includes(p.id)) {
                html += `
                    <div class="mod-row" onclick="setModalProp('cinnamon', !modalState.cinnamon)" style="cursor:pointer;">
                        <div>
                            <span class="mod-row-title">+ Корица</span>
                            <span class="mod-row-sub">Бесплатно</span>
                        </div>
                        <button class="chip ${modalState.cinnamon ? 'active' : ''}">${modalState.cinnamon ? 'Добавлено ✓' : 'Добавить'}</button>
                    </div>
                `;
            }

            // 6. Сахар (0 - 3 порции, бесплатно ко всем напиткам)
            if (isDrink) {
                html += `
                    <div class="mod-row">
                        <div>
                            <span class="mod-row-title">Сахар</span>
                            <span class="mod-row-sub">Бесплатно (макс. 3)</span>
                        </div>
                        <div class="controls">
                            <button class="ctrl-btn" onclick="changeSugar(-1)">-</button>
                            <span class="item-count">${modalState.sugar}</span>
                            <button class="ctrl-btn plus" onclick="changeSugar(1)">+</button>
                        </div>
                    </div>
                `;
            }

            let finalPrice = calcCurrentModalPrice();
            html += `<button class="add-modal-btn" onclick="addFromModal()">Добавить в корзину • ${finalPrice} ₽</button>`;

            document.getElementById('modal-body').innerHTML = html;
        }

        function setModalVar(idx) {
            modalState.varIdx = idx;
            renderModalContent();
        }

        function setModalProp(prop, val) {
            modalState[prop] = val;
            renderModalContent();
        }

        function changeSugar(delta) {
            let next = modalState.sugar + delta;
            if (next >= 0 && next <= 3) {
                modalState.sugar = next;
                renderModalContent();
            }
        }

        function addFromModal() {
            let p = products.find(item => item.id === modalState.prodId);
            let activeVar = p.variants[modalState.varIdx];
            let isDrink = DRINK_CATEGORIES.includes(p.category);
            let finalPrice = calcCurrentModalPrice();

            let mods = [];
            if (activeVar.size) mods.push(activeVar.size);
            if (HAS_ALT_MILK.includes(p.id) && modalState.milk !== 'Обычное') {
                mods.push(`молоко: ${modalState.milk.toLowerCase()}`);
            }
            if (HAS_SYRUP_LIST.includes(p.id) && modalState.syrup !== 'Без сиропа') {
                mods.push(`сироп: ${modalState.syrup.toLowerCase()}`);
            }
            if (HAS_BUMBLE_MODS.includes(p.id)) {
                mods.push(modalState.bumbleSyrup.toLowerCase());
                mods.push(modalState.temp.toLowerCase());
            }
            if (HAS_CINNAMON.includes(p.id) && modalState.cinnamon) {
                mods.push('+корица');
            }
            if (isDrink && modalState.sugar > 0) {
                mods.push(`сахар: ${modalState.sugar}`);
            }

            let fullTitle = mods.length > 0 ? `${p.title} (${mods.join(', ')})` : p.title;
            let cartKey = `${p.id}_${fullTitle}`;

            if (!cart[cartKey]) {
                cart[cartKey] = { prodId: p.id, title: fullTitle, price: finalPrice, count: 0 };
            }
            cart[cartKey].count += 1;

            closeModal();
            updateMainButton();
            renderItems(currentCategory);
        }

        function changeCartItem(key, delta) {
            if (!cart[key]) return;
            cart[key].count += delta;
            if (cart[key].count <= 0) delete cart[key];
            
            renderCheckoutCart();
            updateMainButton();
            renderItems(currentCategory);
        }

        function renderCheckoutCart() {
            let cartHtml = '';
            let total = 0;
            for (let key in cart) {
                let item = cart[key];
                let sum = item.price * item.count;
                total += sum;
                cartHtml += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <span class="cart-item-title">${item.title}</span>
                            <span class="cart-item-price">${item.price} ₽ × ${item.count} = ${sum} ₽</span>
                        </div>
                        <div class="controls">
                            <button class="ctrl-btn" onclick="changeCartItem('${key}', -1)">-</button>
                            <span class="item-count">${item.count}</span>
                            <button class="ctrl-btn plus" onclick="changeCartItem('${key}', 1)">+</button>
                        </div>
                    </div>
                `;
            }
            cartHtml += `<p style="font-size: 18px; margin-top: 15px;"><strong>Итого: ${total} ₽</strong></p>`;
            document.getElementById('cart-list').innerHTML = cartHtml;
        }

        function updateMainButton() {
            let total = 0;
            let count = 0;
            for (let key in cart) {
                total += cart[key].price * cart[key].count;
                count += cart[key].count;
            }

            if (total > 0) {
                if (currentView === 'menu') {
                    tg.MainButton.setText(`Корзина (${count} шт) • ${total} ₽`);
                } else {
                    tg.MainButton.setText(`Подтвердить заказ • ${total} ₽`);
                }
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
                if (currentView === 'checkout') backToMenu();
            }
        }

        function backToMenu() {
            document.getElementById('checkout').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            currentView = 'menu';
            updateMainButton();
        }

        tg.MainButton.onClick(() => {
            if (currentView === 'menu') {
                closeModal();
                document.getElementById('menu').style.display = 'none';
                document.getElementById('checkout').style.display = 'block';
                currentView = 'checkout';
                renderCheckoutCart();
                updateMainButton();
            } else {
                let orderData = {
                    items: cart,
                    payment: document.getElementById('payment-method').value,
                    type: 'pickup'
                };
                tg.sendData(JSON.stringify(orderData));
                tg.close();
            }
        });

        renderItems('all');
    </script>
</body>
</html>
