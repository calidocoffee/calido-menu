<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calido Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }
        h2 { margin-top: 0; font-size: 22px; margin-bottom: 15px; }
        
        /* Горизонтальная лента разделов */
        .categories {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Карточки товаров */
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
        }
        .item img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .item-info { flex-grow: 1; padding-right: 10px; }
        .item-title { font-weight: bold; font-size: 15px; margin-bottom: 6px; display: block; }
        .item-desc { font-size: 12px; color: var(--tg-theme-hint-color, #888); margin-bottom: 6px; display: block; }
        .item-price { font-weight: 600; font-size: 15px; display: block; margin-top: 4px; }
        
        /* Переключатели объема */
        .sizes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }
        .size-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }
        .size-btn.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Кнопки плюс и минус */
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ctrl-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn.plus {
            background-color: #3e2723;
            color: #ffffff;
        }
        .item-count {
            font-weight: bold;
            font-size: 15px;
            min-width: 16px;
            text-align: center;
        }

        /* Экран оформления */
        #checkout { display: none; }
        .checkout-block {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            font-size: 16px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--tg-theme-link-color, #3390ec);
            font-size: 16px;
            padding: 0;
            margin-bottom: 15px;
            cursor: pointer;
        }

        <div class="categories">

            <button class="cat-btn" onclick="filter('sweet-bf', event)">Сладкие завтраки</button>
            <button class="cat-btn" onclick="filter('pasta', event)">Паста</button>
            <button class="cat-btn" onclick="filter('salads', event)">Салаты</button>
        </div>

        <div id="items-container"></div>
    </div>

    <!-- Экран оформления заказа -->

        <h3>Ваш заказ:</h3>
        <div id="cart-list"></div>
    </div>

            { id: 'sb8', title: 'Шоколадная овсянка с бананом', desc: 'Сладкий завтрак', category: 'sweet-bf', img: 'https://images.unsplash.com/photo-1517673132405-a56a62b18caf?w=200&q=80', variants: [{ id: 80, size: '', price: 350 }] },

            // ПАСТА
            { id: 'p1', title: 'Паста с креветками и томатами', desc: 'Паста', category: 'pasta', img: 'https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=200&q=80', variants: [{ id: 81, size: '', price: 790 }] },
            { id: 'p2', title: 'Паста с курицей и грибами', desc: 'Паста', category: 'pasta', img: 'https://images.unsplash.com/photo-1612874742237-6526221588e3?w=200&q=80', variants: [{ id: 82, size: '', price: 650 }] },

            // САЛАТЫ
            { id: 'sa1', title: 'Зеленый салат со страчателлой', desc: 'Салат', category: 'salads', img: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=200&q=80', variants: [{ id: 83, size: '', price: 450 }] },
            { id: 'sa2', title: 'Салат креветки с апельсинами', desc: 'Салат', category: 'salads', img: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=200&q=80', variants: [{ id: 84, size: '', price: 750 }] },
            { id: 'sa3', title: 'Цезарь с креветками', desc: 'Салат', category: 'salads', img: 'https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=200&q=80', variants: [{ id: 85, size: '', price: 650 }] },
            { id: 'sa4', title: 'Цезарь с курицей', desc: 'Салат', category: 'salads', img: 'https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=200&q=80', variants: [{ id: 86, size: '', price: 570 }] }
        ];

        let cart = {};
        let selectedVariants = {}; // Запоминаем, какой объем сейчас выбран на каждой карточке
        let currentView = 'menu';
        let currentCategory = 'all';

        function selectVariant(prodId, varIdx) {
            selectedVariants[prodId] = varIdx;
            renderItems(currentCategory);
        }

        function renderItems(category) {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            products.forEach(p => {
                if (category === 'all' || p.category === category) {
                    let varIdx = selectedVariants[p.id] || 0;
                    let activeVar = p.variants[varIdx];
                    let count = cart[activeVar.id] ? cart[activeVar.id].count : 0;
                    
                    // Если у напитка больше 1 объема — рисуем кнопки выбора, если 1 — просто пишем объем или описание
                    let middleHtml = '';
                    if (p.variants.length > 1) {
                        let btns = p.variants.map((v, idx) => 
                            `<button class="size-btn ${idx === varIdx ? 'active' : ''}" onclick="selectVariant('${p.id}', ${idx})">${v.size}</button>`
                        ).join('');
                        middleHtml = `<div class="sizes">${btns}</div>`;
                    } else {
                        let descText = activeVar.size ? activeVar.size : (p.desc || '');
                        middleHtml = `<span class="item-desc">${descText}</span>`;
                    }
                    
                    let controlsHtml = count > 0 
                        ? `<div class="controls">
                             <button class="ctrl-btn" onclick="changeCount('${p.id}', -1)">-</button>
                             <span class="item-count">${count}</span>
                             <button class="ctrl-btn plus" onclick="changeCount('${p.id}', 1)">+</button>
                           </div>`
                        : `<div class="controls">
                             <button class="ctrl-btn" onclick="changeCount('${p.id}', 1)">+</button>
                           </div>`;

                    container.innerHTML += `
                        <div class="item">
                            <img src="${p.img}">
                            <div class="item-info">
                                <span class="item-title">${p.title}</span>
                                ${middleHtml}
                                <span class="item-price">${activeVar.price} ₽</span>
                            </div>
                            ${controlsHtml}
                        </div>
                    `;
                }
            });
        }

        function filter(category, event) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderItems(category);
        }

        function changeCount(prodId, delta) {
            let product = products.find(p => p.id === prodId);
            let varIdx = selectedVariants[prodId] || 0;
            let activeVar = product.variants[varIdx];
            
            let fullTitle = activeVar.size ? `${product.title} (${activeVar.size})` : product.title;
            
            if (!cart[activeVar.id]) {
                cart[activeVar.id] = { id: activeVar.id, title: fullTitle, price: activeVar.price, count: 0 };
            }
            cart[activeVar.id].count += delta;
            
            if (cart[activeVar.id].count <= 0) {
                delete cart[activeVar.id];
            }
            
            updateMainButton();
            renderItems(currentCategory);
        }

        function updateMainButton() {
            let total = 0;
            let count = 0;
            for (let id in cart) {
                total += cart[id].price * cart[id].count;
                count += cart[id].count;
            }

            if (total > 0) {
                if (currentView === 'menu') {
                    tg.MainButton.setText(`Корзина (${count} шт) • ${total} ₽`);
                } else {
                    tg.MainButton.setText(`Подтвердить заказ • ${total} ₽`);
                }
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
                if (currentView === 'checkout') backToMenu();
            }
        }

        function backToMenu() {
            document.getElementById('checkout').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            currentView = 'menu';
            updateMainButton();
        }

        tg.MainButton.onClick(() => {
            if (currentView === 'menu') {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('checkout').style.display = 'block';
                currentView = 'checkout';
                
                let cartHtml = '';
                let total = 0;
                for (let id in cart) {
                    cartHtml += `<p>${cart[id].title} x ${cart[id].count} = ${cart[id].price * cart[id].count} ₽</p>`;
                    total += cart[id].price * cart[id].count;
                }
                cartHtml += `<strong>Итого: ${total} ₽</strong>`;
                document.getElementById('cart-list').innerHTML = cartHtml;

                updateMainButton();
            } else {
                let orderData = {
                    items: cart,
                    payment: document.getElementById('payment-method').value,
                    type: 'pickup'
                };
                tg.sendData(JSON.stringify(orderData));
                tg.close();
            }
        });

        renderItems('all');
    </script>
</body>
</html>
