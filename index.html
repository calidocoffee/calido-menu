<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calido Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --safe-top: calc(max(var(--tg-safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px)) + 12px);
        }

        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: var(--safe-top) 15px 90px 15px;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Шапка с приветствием и кнопками */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }
        .top-bar h2 {
            margin: 0;
            font-size: 20px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .view-toggle-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .profile-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        
        /* Информационная плашка о работе кухни и кофейни */
        .schedule-banner {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-hint-color, #666);
            font-size: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            line-height: 1.4;
            border-left: 4px solid #3e2723;
        }
        .schedule-banner strong { color: var(--tg-theme-text-color, #000); }
        .schedule-banner.closed-alert {
            border-left-color: #d32f2f;
            background-color: rgba(211, 47, 47, 0.08);
            color: #d32f2f;
        }

        /* Живая плашка активного заказа */
        .live-order-card {
            background-color: rgba(62, 39, 35, 0.08);
            border: 1px solid #3e2723;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
            cursor: pointer;
        }
        .live-order-card.ready {
            background-color: rgba(46, 125, 50, 0.12);
            border-color: #2e7d32;
        }
        .live-order-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            display: block;
        }
        .live-order-sub {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
            display: block;
        }

        /* Зафиксированная горизонтальная лента разделов */
        .categories {
            position: sticky;
            top: calc(max(var(--tg-safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px)));
            z-index: 1000;
            background-color: var(--tg-theme-bg-color, #ffffff);
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 10px 0;
            margin-bottom: 15px;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Карточки товаров в общем списке */
        .items-list {
            display: block;
        }
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
            cursor: pointer;
        }
        .item.disabled-item {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .item img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .item-info { flex-grow: 1; padding-right: 10px; }
        .item-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: block; }
        .item-desc { font-size: 12px; color: var(--tg-theme-hint-color, #888); margin-bottom: 6px; display: block; }
        .item-price { font-weight: 600; font-size: 15px; display: block; }
        
        .open-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 18px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .open-btn.in-cart {
            background-color: #3e2723;
            color: #ffffff;
        }
        .open-btn.disabled-btn {
            background-color: #e0e0e0;
            color: #888888;
            font-weight: 500;
            font-size: 12px;
        }

        /* Вид сеткой по 2 плашки в ряд */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .items-grid .item {
            flex-direction: column;
            align-items: stretch;
            margin-bottom: 0;
            padding-bottom: 12px;
            border-bottom: none;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 14px;
            overflow: hidden;
        }
        .items-grid .item img {
            width: 100%;
            height: 128px;
            border-radius: 0;
            margin-right: 0;
            margin-bottom: 8px;
        }
        .items-grid .item-info {
            padding: 0 10px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .items-grid .item-title {
            font-size: 14px;
            line-height: 1.25;
        }
        .items-grid .item-desc {
            font-size: 11px;
            margin-bottom: auto;
            padding-bottom: 4px;
        }
        .items-grid .item-price {
            font-size: 14px;
            margin-top: 4px;
        }
        .items-grid .open-btn {
            margin: 0 10px;
            padding: 8px 10px;
            border-radius: 10px;
            text-align: center;
            background-color: var(--tg-theme-bg-color, #ffffff);
        }
        .items-grid .open-btn.in-cart {
            background-color: #3e2723;
            color: #ffffff;
        }
        .items-grid .open-btn.disabled-btn {
            background-color: rgba(0, 0, 0, 0.08);
            color: var(--tg-theme-hint-color, #888888);
        }

        /* Модальное окно карточки товара (шторка снизу) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1001;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            width: 100%;
            max-height: 88vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: var(--tg-theme-secondary-bg-
