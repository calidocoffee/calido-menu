<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calido Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Шапка с приветствием и кнопкой Личного кабинета */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }
        .top-bar h2 {
            margin: 0;
            font-size: 20px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .profile-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        
        /* Информационная плашка о работе кухни и кофейни */
        .schedule-banner {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-hint-color, #666);
            font-size: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            line-height: 1.4;
            border-left: 4px solid #3e2723;
        }
        .schedule-banner strong { color: var(--tg-theme-text-color, #000); }
        .schedule-banner.closed-alert {
            border-left-color: #d32f2f;
            background-color: rgba(211, 47, 47, 0.08);
            color: #d32f2f;
        }

        /* Живая плашка активного заказа */
        .live-order-card {
            background-color: rgba(62, 39, 35, 0.08);
            border: 1px solid #3e2723;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
            cursor: pointer;
        }
        .live-order-card.ready {
            background-color: rgba(46, 125, 50, 0.12);
            border-color: #2e7d32;
        }
        .live-order-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            display: block;
        }
        .live-order-sub {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
            display: block;
        }

        /* Зафиксированная горизонтальная лента разделов */
        .categories {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--tg-theme-bg-color, #ffffff);
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 10px 0;
            margin-bottom: 15px;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Карточки товаров в общем списке */
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
            cursor: pointer;
        }
        .item.disabled-item {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .item img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .item-info { flex-grow: 1; padding-right: 10px; }
        .item-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: block; }
        .item-desc { font-size: 12px; color: var(--tg-theme-hint-color, #888); margin-bottom: 6px; display: block; }
        .item-price { font-weight: 600; font-size: 15px; display: block; }
        
        .open-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 18px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .open-btn.in-cart {
            background-color: #3e2723;
            color: #ffffff;
        }
        .open-btn.disabled-btn {
            background-color: #e0e0e0;
            color: #888888;
            font-weight: 500;
            font-size: 12px;
        }

        /* Модальное окно карточки товара (шторка снизу) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1001;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            width: 100%;
            max-height: 88vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }
        .modal-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 12px;
        }
        .modal-title { font-size: 20px; font-weight: bold; margin: 0 0 6px 0; }
        .modal-desc { font-size: 13px; color: var(--tg-theme-hint-color, #777); margin-bottom: 10px; line-height: 1.4; }
        
        .kbju-box {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .kbju-box strong { color: var(--tg-theme-text-color, #000); }

        /* Секции модификаторов в карточке */
        .mod-section { margin-bottom: 16px; }
        .mod-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .chip.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        .mod-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .mod-row-title { font-size: 14px; font-weight: 600; }
        .mod-row-sub { font-size: 11px; color: var(--tg-theme-hint-color, #888); display: block; }

        /* Кнопки плюс и минус */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ctrl-btn {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000);
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn.plus {
            background-color: #3e2723;
            color: #ffffff;
            border-color: #3e2723;
        }
        .item-count {
            font-weight: bold;
            font-size: 15px;
            min-width: 18px;
            text-align: center;
        }

        /* Нижний ряд кнопок в модалке: Избранное + В корзину */
        .modal-actions-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .fav-toggle-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 12px;
            width: 52px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .add-modal-btn {
            flex-grow: 1;
            background-color: #3e2723;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Экраны */
        #checkout, #profile, #profile-favs, #profile-history { display: none; }

        .checkout-block {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            font-size: 15px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .prep-time-hint {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #666);
            margin-top: 8px;
            display: block;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--tg-theme-link-color, #3390ec);
            font-size: 16px;
            padding: 0;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
        }
        .cart-item-info { flex-grow: 1; padding-right: 10px; }
        .cart-item-title { font-size: 14px; font-weight: 600; display: block; margin-bottom: 3px; }
        .cart-item-price { font-size: 13px; color: var(--tg-theme-hint-color, #777); }
        .cart-stop-warn {
            display: inline-block;
            margin-top: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #d32f2f;
        }

        /* Элементы Личного кабинета */
        .profile-section-title {
            font-size: 16px;
            font-weight: bold;
            margin: 18px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .profile-menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .profile-nav-btn {
            width: 100%;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 14px;
            padding: 15px 16px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-align: left;
            box-sizing: border-box;
        }
        .profile-nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--tg-theme-hint-color, #888);
            font-size: 14px;
            font-weight: 500;
        }
        .profile-tips-btn {
            width: 100%;
            background-color: #3e2723;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 15px 16px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-top: 18px;
            box-sizing: border-box;
        }
        .reviews-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .review-btn {
            flex: 1;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 12px;
            padding: 11px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Карточки внутри Избранного и Истории */
        .profile-card {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .fav-card {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .fav-card img {
            width: 68px;
            height: 68px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .fav-card-content {
            flex-grow: 1;
            min-width: 0;
        }
        .profile-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #777);
        }
        .profile-card-body {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .profile-card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .action-small-btn {
            background-color: #3e2723;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .remove-small-btn {
            background: none;
            border: none;
            color: #d32f2f;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 6px;
        }
        .empty-hint {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
        }
        
        #debug-status {
            margin-top: 12px;
            font-size: 13px;
            color: #d32f2f;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    
    <!-- Экран меню -->
    <div id="menu">
        <div class="top-bar">
            <h2 id="greeting">Привет! 👋</h2>
            <button class="profile-btn" onclick="openProfile()">👤 Кабинет</button>
        </div>

        <div id="schedule-info" class="schedule-banner"></div>
        
        <!-- Плашка живого статуса заказа прямо на главной -->
        <div id="menu-live-order" style="display: none;" onclick="openProfile()"></div>
        
        <div class="categories">
            <button class="cat-btn active" onclick="filter('all', event)">Все</button>
            <button class="cat-btn" onclick="filter('seasonal', event)">⚡️ Сезонное меню</button>
            <button class="cat-btn" onclick="filter('milk', event)">С молоком</button>
            <button class="cat-btn" onclick="filter('black', event)">Черный</button>
            <button class="cat-btn" onclick="filter('not-coffee', event)">Не кофе</button>
            <button class="cat-btn" onclick="filter('hearty-bf', event)">Сытные завтраки</button>
            <button class="cat-btn" onclick="filter('sweet-bf', event)">Сладкие завтраки</button>
            <button class="cat-btn" onclick="filter('pasta', event)">Паста</button>
            <button class="cat-btn" onclick="filter('salads', event)">Салаты</button>
        </div>

        <div id="items-container"></div>
    </div>

    <!-- Экран Личного кабинета -->
    <div id="profile">
        <button class="back-btn" onclick="backToMenu()">← Назад в меню</button>
        <h2 id="profile-user-title" style="margin-top: 0;">Личный кабинет</h2>

        <div class="profile-section-title">📡 Активный заказ</div>
        <div id="profile-active-order"></div>

        <div class="profile-menu-list">
            <button class="profile-nav-btn" onclick="openFavoritesPage()">
                <span class="profile-nav-left">❤️ Избранное</span>
                <span class="profile-nav-right"><span id="favs-count-badge">0</span> ›</span>
            </button>
            <button class="profile-nav-btn" onclick="openHistoryPage()">
                <span class="profile-nav-left">🕒 Мои заказы</span>
                <span class="profile-nav-right"><span id="hist-count-badge">0</span> ›</span>
            </button>
        </div>

        <button class="profile-tips-btn" onclick="openExternalLink(TIPS_URL, 'Чаевые')">
            💸 Оставить чаевые
        </button>

        <div class="reviews-row">
            <button class="review-btn" onclick="openExternalLink(YANDEX_REVIEWS_URL, 'Отзывы на Яндексе')">
                ⭐️ Яндекс Карты
            </button>
            <button class="review-btn" onclick="openExternalLink(TWOGIS_REVIEWS_URL, 'Отзывы на 2ГИС')">
                ⭐️ 2ГИС
            </button>
        </div>
    </div>

    <!-- Подстраница Избранного -->
    <div id="profile-favs">
        <button class="back-btn" onclick="openProfile()">← Назад в кабинет</button>
        <h2 style="margin-top: 0;">❤️ Избранное</h2>
        <div id="profile-favorites-list"></div>
    </div>

    <!-- Подстраница Истории заказов -->
    <div id="profile-history">
        <button class="back-btn" onclick="openProfile()">← Назад в кабинет</button>
        <h2 style="margin-top: 0;">🕒 Мои заказы</h2>
        <div id="profile-history-list"></div>
    </div>

    <!-- Модальная карточка товара с модификаторами -->
    <div id="product-modal" class="modal-overlay" onclick="closeModalOnBg(event)">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Экран оформления заказа -->
    <div id="checkout">
        <button class="back-btn" onclick="backToMenu()">← Назад в меню</button>
        <h2>Оформление заказа</h2>
        
        <div class="checkout-block">
            <strong>Способ получения:</strong><br>
            Самовывоз<br>
            <small style="color: #777;">Саратов, ул. Рабочая, 49</small>
        </div>

        <div class="checkout-block">
            <strong>К какому времени приготовить?</strong>
            <span id="prep-estimate-text" class="prep-time-hint"></span>
            <select id="ready-time-select"></select>
        </div>

        <div class="checkout-block">
            <strong>Способ оплаты:</strong>
            <select id="payment-method">
                <option value="Картой онлайн">Картой онлайн</option>
            </select>
        </div>
        
        <h3>Ваш заказ:</h3>
        <div id="cart-list"></div>
        <div id="debug-status"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = 'https://calido-menu-production.up.railway.app';

        // === ССЫЛКИ ДЛЯ КАБИНЕТА ===
        const TIPS_URL = 'https://netmonet.co/qr/895097/groups/0?o=2';
        const YANDEX_REVIEWS_URL = 'https://ya.cc/t/zAMmU0zv6DnLfT';
        const TWOGIS_REVIEWS_URL = 'https://2gis.ru/saratov/firm/70000001096521686/tab/reviews?immersive=on';

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getUtf8ByteLength(str) {
            return new Blob([str]).size;
        }

        const currentUser = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
        if (currentUser && currentUser.first_name) {
            document.getElementById('greeting').innerText = `Привет, ${currentUser.first_name}! 👋`;
            document.getElementById('profile-user-title').innerText = `Кабинет • ${currentUser.first_name}`;
        }

        const SYRUP_PRICE = 30;
        const PORRIDGE_ALT_MILK_PRICE = 100;

        const SYRUPS_LIST = [
            'Без сиропа', 'Корица', 'Малина', 'Миндаль', 'Имбирный пряник',
            'Обжаренный лесной орех', 'Фисташка', 'Вишня', 'Ваниль',
            'Соленая карамель', 'Кокос', 'Лесной орех', 'Карамель',
            'Лаванда', 'Груша', 'Клубника', 'Черника', 'Зеленое яблоко',
            'Грецкий орех', 'Темный шоколад', 'Персик', 'Белый шоколад',

        let userFavorites = [];

        function showScreen(screenId) {
            ['menu', 'profile', 'profile-favs', 'profile-history', 'checkout'].forEach(id => {
                document.getElementById(id).style.display = (id === screenId) ? 'block' : 'none';
            });
            currentView = screenId;
            window.scrollTo(0, 0);
            updateMainButton();
        }

        function openExternalLink(url, name) {
            if (!url) {
                tg.showAlert(`Ссылка на «${name}» скоро появится!`);
                return;
            }
            if (tg.openLink) {
                tg.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        async function fetchStopList() {
            try {
                let res = await fetch(`${BACKEND_URL}/stoplist`);
                if (!res.ok) return;
                let data = await res.json();
                if (data.ok && Array.isArray(data.stoplist)) {
                    stopList = new Set(data.stoplist);
                    if (currentView === 'menu') renderItems(currentCategory);
                    if (currentView === 'checkout') renderCheckoutCart();
                }
            } catch (e) {}
        }

        function saveCartData() {
            try { localStorage.setItem('calido_cart', JSON.stringify(cart)); } catch (e) {}
        }

        function loadStorageData() {
            try {
                let localFav = localStorage.getItem('calido_favs');
                if (localFav) {
                    let parsed = JSON.parse(localFav);
                    if (Array.isArray(parsed)) userFavorites = parsed;
                }
                let localHist = localStorage.getItem('calido_hist');
                if (localHist) {
                    let parsed = JSON.parse(localHist);
                    if (Array.isArray(parsed)) userHistory = parsed;
                }

                let localCart = localStorage.getItem('calido_cart');
                if (localCart) {
                    let parsedCart = JSON.parse(localCart);
                    if (parsedCart && typeof parsedCart === 'object') {
                        for (let k in parsedCart) {
                            let it = parsedCart[k];
                            const n = Number(it && it.count);
                            if (it && it.config && Number.isInteger(n) && n >= 1 && n <= 50) {
                                let built = buildItemFromConfig(it.config);
                                if (built) {
                                    addBuiltItemToCart(built, n, false);
                                }
                            }
                        }
                    }
                }
            } catch (e) {}

            if (tg.CloudStorage) {
                try {
                    tg.CloudStorage.getItems(['calido_favs', 'calido_hist'], (err, values) => {
                        if (!err && values) {
                            if (values.calido_favs) {
                                try {
                                    let parsed = JSON.parse(values.calido_favs);
                                    if (Array.isArray(parsed)) {
                                        userFavorites = parsed;
                                        localStorage.setItem('calido_favs', values.calido_favs);
                                    }
                                } catch (e) {}
                            }
                            if (values.calido_hist) {
                                try {
                                    let parsed = JSON.parse(values.calido_hist);
                                    if (Array.isArray(parsed)) {
                                        userHistory = parsed;
                                        localStorage.setItem('calido_hist', values.calido_hist);
                                    }
                                } catch (e) {}
                            }
                            if (currentView === 'profile') renderProfileMain();
                            if (currentView === 'profile-favs') renderFavoritesList();
                            if (currentView === 'profile-history') renderHistoryList();
                        }
                    });
                } catch (e) {}
            }
        }

        function saveToCloudSafe(key, list) {
            if (!tg.CloudStorage) return;
            try {
                let trimmed = list.slice();
                let str = JSON.stringify(trimmed);
                while (getUtf8ByteLength(str) > 3900 && trimmed.length > 0) {
                    trimmed.pop();
                    str = JSON.stringify(trimmed);
                }
                tg.CloudStorage.setItem(key, str);
            } catch (e) {}
        }

        function saveFavoritesData() {
            if (userFavorites.length > 20) userFavorites = userFavorites.slice(0, 20);
            let compactFavs = userFavorites.map(f => ({ config: f.config }));
            let str = JSON.stringify(compactFavs);
            try { localStorage.setItem('calido_favs', str); } catch (e) {}
            saveToCloudSafe('calido_favs', compactFavs);
        }

        function saveHistoryData() {
            if (userHistory.length > 15) userHistory = userHistory.slice(0, 15);
            let compactHist = userHistory.map(h => ({
                date: h.date,
                total: h.total,
                items: (h.items || []).map(it => ({ count: it.count, config: it.config }))
            }));
            let str = JSON.stringify(compactHist);
            try { localStorage.setItem('calido_hist', str); } catch (e) {}
            saveToCloudSafe('calido_hist', compactHist.slice(0, 7));
        }

        // === ФУНКЦИИ ВРЕМЕНИ И ГРАФИКА РАБОТЫ (САРАТОВ UTC+4) ===
        function getSaratovTime() {
            const now = new Date();
            const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
            const saratovDate = new Date(utcMs + (4 * 3600000));
            return {
                dateObj: saratovDate,
                day: saratovDate.getDay(),
                hours: saratovDate.getHours(),
                minutes: saratovDate.getMinutes(),
                totalMinutes: saratovDate.getHours() * 60 + saratovDate.getMinutes()
            };
        }

        function formatMinToHHMM(totalMin) {
            let h = Math.floor(totalMin / 60);
            let m = totalMin % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function getScheduleRules() {
            const st = getSaratovTime();
            const isWeekend = (st.day === 0 || st.day === 6);
            
            const drinksOpen = isWeekend ? (8 * 60) : (7 * 60 + 30);
            const drinksClose = 21 * 60;
            
            const kitchenOpen = isWeekend ? (9 * 60) : (7 * 60 + 30);
            const kitchenClose = isWeekend ? (15 * 60) : (14 * 60 + 45);

            return {
                isWeekend,
                nowMin: st.totalMinutes,
                drinksOpen,
                drinksClose,
                kitchenOpen,
                kitchenClose,
                isCafeClosedForToday: st.totalMinutes >= drinksClose,
                isKitchenClosedForToday: st.totalMinutes >= kitchenClose
            };
        }

        function updateScheduleBanner() {
            const rules = getScheduleRules();
            const banner = document.getElementById('schedule-info');
            const kOpenStr = formatMinToHHMM(rules.kitchenOpen);
            const kCloseStr = formatMinToHHMM(rules.kitchenClose);
            const dOpenStr = formatMinToHHMM(rules.drinksOpen);

            if (rules.isCafeClosedForToday) {
                banner.className = 'schedule-banner closed-alert';
                banner.innerHTML = `🌙 <strong>Кофейня сейчас закрыта.</strong> Ждем вас завтра с ${dOpenStr}!`;
            } else if (rules.isKitchenClosedForToday) {
                banner.className = 'schedule-banner';
                banner.innerHTML = `☕️ Напитки до 21:00  |  🍳 <strong>Кухня работает до ${kCloseStr}</strong> (сегодня прием заказов по кухне завершен)`;
            } else {
                banner.className = 'schedule-banner';
                banner.innerHTML = `☕️ Напитки: ${dOpenStr}–21:00  |  🍳 <strong>Кухня работает с ${kOpenStr} до ${kCloseStr}</strong>`;
            }
        }

        // === ЖИВОЙ СТАТУС ЗАКАЗА С СЕРВЕРА (ПАУЗА В ФОНЕ + BACKOFF) ===
        function scheduleNextOrderPoll() {
            if (orderStatusTimer) clearTimeout(orderStatusTimer);
            if (document.hidden) return;
            let baseDelay = activeOrderState ? 8000 : 30000;
            let delay = pollErrorCount > 0 ? Math.min(60000, baseDelay * Math.pow(2, pollErrorCount)) : baseDelay;
            orderStatusTimer = setTimeout(fetchActiveOrderStatus, delay);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (orderStatusTimer) clearTimeout(orderStatusTimer);
            } else {
                fetchActiveOrderStatus();
            }
        });

        async function fetchActiveOrderStatus() {
            if (!tg.initData || document.hidden) return;
            try {
                let res = await fetch(`${BACKEND_URL}/order_status`, {
                    headers: {
                        'X-Telegram-Init-Data': tg.initData
                    }
                });
                if (res.status === 401) {
                    pollErrorCount = Math.min(pollErrorCount + 1, 4);
                    scheduleNextOrderPoll();
                    return;
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                let data = await res.json();
                if (data.ok) {
                    pollErrorCount = 0;
                    activeOrderState = data.active_order;
                    renderLiveOrderBanner();
                    if (currentView === 'profile') renderActiveOrderInProfile();
                }
            } catch (e) {
                pollErrorCount = Math.min(pollErrorCount + 1, 4);
            }
            scheduleNextOrderPoll();
        }

        function renderLiveOrderBanner() {
            const box = document.getElementById('menu-live-order');
            if (!activeOrderState) {
                box.style.display = 'none';
                return;
            }
            const safeItems = escapeHtml(activeOrderState.short_items);
            const safeReady = escapeHtml(activeOrderState.ready_label);
            box.style.display = 'block';
            if (activeOrderState.status === 'ready') {
                box.className = 'live-order-card ready';
                box.innerHTML = `
                    <span class="live-order-title">🎉 Ваш заказ готов! Ждем вас на стойке</span>
                    <span class="live-order-sub">${safeItems} • Нажмите, чтобы открыть кабинет</span>
                `;
            } else if (activeOrderState.status === 'scheduled') {
                box.className = 'live-order-card';
                box.innerHTML = `
                    <span class="live-order-title">📅 Предзаказ принят (${safeReady})</span>
                    <span class="live-order-sub">${safeItems} • Начнем готовить точно ко времени</span>
                `;
            } else {
                box.className = 'live-order-card';
                box.innerHTML = `
                    <span class="live-order-title">⏳ Бариста готовит ваш заказ (${safeReady})</span>
                    <span class="live-order-sub">${safeItems} • Статус обновится автоматически</span>
                `;
            }
        }

        // === РАСЧЕТ ЦЕНЫ И ЗАГОЛОВКА ПО КОНФИГУРАЦИИ ТОВАРА ===
        function getAltMilkExtra(sizeStr) {
            if (sizeStr.includes('200')) return 80;
            if (sizeStr.includes('300')) return 100;
            if (sizeStr.includes('400')) return 120;
            return 0;
        }

        function buildItemFromConfig(cfg) {
            if (!cfg || typeof cfg !== 'object') return null;
            if (typeof cfg.prodId !== 'string') return null;
            let p = products.find(item => item.id === cfg.prodId);
            if (!p) return null;

            let rawVarIdx = Number(cfg.varIdx);
            let varIdx = (Number.isInteger(rawVarIdx) && rawVarIdx >= 0 && rawVarIdx < p.variants.length) ? rawVarIdx : 0;
            let activeVar = p.variants[varIdx];
            let isDrink = DRINK_CATEGORIES.includes(p.category);
            let price = activeVar.price;

            let safeMilk = (typeof cfg.milk === 'string' && MILK_LIST.includes(cfg.milk)) ? cfg.milk : 'Обычное';
            let safeSyrup = (typeof cfg.syrup === 'string' && SYRUPS_LIST.includes(cfg.syrup)) ? cfg.syrup : 'Без сиропа';
            let safeBumbleSyrup = (typeof cfg.bumbleSyrup === 'string' && ['С сиропом', 'Без сиропа'].includes(cfg.bumbleSyrup)) ? cfg.bumbleSyrup : 'С сиропом';
            let safeTemp = (typeof cfg.temp === 'string' && ['Горячий', 'Со льдом', 'Без льда'].includes(cfg.temp)) ? cfg.temp : 'Со льдом';
            let safeEgg = (typeof cfg.eggType === 'string' && EGG_CHOICES.includes(cfg.eggType)) ? cfg.eggType : 'Глазунья';
            let rawSugar = Number(cfg.sugar);
            let safeSugar = (Number.isInteger(rawSugar) && rawSugar >= 0 && rawSugar <= 3) ? rawSugar : 0;

            if (HAS_ALT_MILK.includes(p.id) && safeMilk !== 'Обычное') {
                price += getAltMilkExtra(activeVar.size);
            }
            if (PORRIDGE_IDS.includes(p.id) && safeMilk !== 'Обычное') {
                price += PORRIDGE_ALT_MILK_PRICE;
            }
            if (HAS_SYRUP_LIST.includes(p.id) && safeSyrup !== 'Без сиропа') {
                price += SYRUP_PRICE;
            }

            let mods = [];
            if (activeVar.size) mods.push(activeVar.size);
            if ((HAS_ALT_MILK.includes(p.id) || PORRIDGE_IDS.includes(p.id)) && safeMilk !== 'Обычное') {
                mods.push(`молоко: ${safeMilk.toLowerCase()}`);
            }
            if (HAS_SYRUP_LIST.includes(p.id) && safeSyrup !== 'Без сиропа') {
                mods.push(`сироп: ${safeSyrup.toLowerCase()}`);
            }
            if (HAS_BUMBLE_MODS.includes(p.id)) {
                mods.push(safeBumbleSyrup.toLowerCase());
                mods.push(safeTemp.toLowerCase());
            }
            if (HAS_CINNAMON.includes(p.id) && cfg.cinnamon === true) {
                mods.push('+корица');
            }
            if (isDrink && safeSugar > 0) {
                mods.push(`сахар: ${safeSugar}`);
            }
            if (HAS_EGG_CHOICE.includes(p.id)) {
                mods.push(safeEgg.toLowerCase());
            }

            let cleanAddons = [];
            if (Array.isArray(cfg.addons) && cfg.addons.length > 0) {
                let allowed = null;
                if (p.category === 'hearty-bf') allowed = HEARTY_ADDONS;
                else if (p.category === 'sweet-bf') allowed = SWEET_ADDONS;

                if (allowed) {
                    allowed.forEach(a => {
                        if (cfg.addons.includes(a.name)) {
                            price += a.price;
                            mods.push(`+${a.name.toLowerCase()}`);
                            cleanAddons.push(a.name);
                        }
                    });
                }
            }

            let fullTitle = mods.length > 0 ? `${p.title} (${mods.join(', ')})` : p.title;
            return {
                prodId: p.id,
                title: fullTitle,
                price: price,
                isDrink: isDrink,
                img: p.img,
                config: {
                    prodId: p.id,
                    varIdx: varIdx,
                    milk: safeMilk,
                    syrup: safeSyrup,
                    bumbleSyrup: safeBumbleSyrup,
                    temp: safeTemp,
                    cinnamon: cfg.cinnamon === true,
                    sugar: safeSugar,
                    eggType: HAS_EGG_CHOICE.includes(p.id) ? safeEgg : '',
                    addons: cleanAddons
                }
            };
        }

        function calculateOrderPrepTime() {
            let fastCount = 0;
            let regCount = 0;
            let foodCount = 0;

            for (let key in cart) {
                let item = cart[key];
                if (item.isDrink) {
                    if (FAST_DRINK_IDS.includes(item.prodId)) {
                        fastCount += item.count;
                    } else {
                        regCount += item.count;
                    }
                } else {
                    foodCount += item.count;
                }
            }

            let fastMin = 0, fastLabel = '';
            if (fastCount >= 1 && fastCount <= 2) { fastMin = 5; fastLabel = '3–5 мин'; }
            else if (fastCount >= 3 && fastCount <= 4) { fastMin = 7; fastLabel = '5–7 мин'; }
            else if (fastCount >= 5) { fastMin = 10; fastLabel = '10 мин'; }

            let regMin = 0, regLabel = '';
            if (regCount === 1) { regMin = 7; regLabel = '7 мин'; }
            else if (regCount >= 2 && regCount <= 3) { regMin = 12; regLabel = '10–12 мин'; }
            else if (regCount >= 4) { regMin = 20; regLabel = '15–20 мин'; }

            let foodMin = 0, foodLabel = '';
            if (foodCount === 1) { foodMin = 12; foodLabel = '12 мин'; }
            else if (foodCount === 2) { foodMin = 17; foodLabel = '12–17 мин'; }
            else if (foodCount >= 3) { foodMin = 20; foodLabel = '20 мин'; }

            let maxMin = Math.max(fastMin, regMin, foodMin);
            let finalLabel = '';
            if (maxMin === foodMin && foodMin > 0) finalLabel = foodLabel;
            else if (maxMin === regMin && regMin > 0) finalLabel = regLabel;
            else finalLabel = fastLabel;

            return {
                prepMinutes: maxMin,
                label: finalLabel,
                hasFood: foodCount > 0
            };
        }

        function buildTimeSlots() {
            const rules = getScheduleRules();
            const prep = calculateOrderPrepTime();
            const select = document.getElementById('ready-time-select');
            const hint = document.getElementById('prep-estimate-text');
            select.innerHTML = '';

            if (rules.isCafeClosedForToday) {
                hint.innerText = 'Кофейня уже закрыта (работаем до 21:00).';
                select.innerHTML = `<option value="">Прием заказов завершен</option>`;
                return false;
            }

            if (prep.hasFood && rules.isKitchenClosedForToday) {
                hint.innerText = `Кухня работает до ${formatMinToHHMM(rules.kitchenClose)}. Удалите блюда кухни из корзины, чтобы заказать напитки.`;
                select.innerHTML = `<option value="">Кухня уже закрыта</option>`;
                return false;
            }

            let baseOpenMin = prep.hasFood ? Math.max(rules.drinksOpen, rules.kitchenOpen) : rules.drinksOpen;
            let limitCloseMin = prep.hasFood ? rules.kitchenClose : rules.drinksClose;
            
            let effectiveStartMin = Math.max(rules.nowMin, baseOpenMin);
            let earliestReadyMin = effectiveStartMin + prep.prepMinutes;

            if (earliestReadyMin > limitCloseMin) {
                hint.innerText = `До закрытия (${formatMinToHHMM(limitCloseMin)}) не успеем приготовить этот заказ (~${prep.label}).`;
                select.innerHTML = `<option value="">Не успеем до закрытия</option>`;
                return false;
            }

            let earliestTimeStr = formatMinToHHMM(earliestReadyMin);
            hint.innerText = `Ориентировочное время готовности: ~${prep.label} после оплаты`;

            if (rules.nowMin < baseOpenMin) {
                select.innerHTML += `<option value="${earliestTimeStr}">К открытию (к ${earliestTimeStr})</option>`;
            } else {
                select.innerHTML += `<option value="${earliestTimeStr}">Как можно скорее (~${prep.label}, к ${earliestTimeStr})</option>`;
            }

            let firstGridSlot = Math.ceil((earliestReadyMin + 1) / 15) * 15;
            for (let t = firstGridSlot; t <= limitCloseMin; t += 15) {
                let timeStr = formatMinToHHMM(t);
                select.innerHTML += `<option value="${timeStr}">${timeStr}</option>`;
            }

            return true;
        }

        function getProductCartCount(prodId) {
            let sum = 0;
            for (let key in cart) {
                if (cart[key].prodId === prodId) sum += cart[key].count;
            }
            return sum;
        }

        function renderItems(category) {
            updateScheduleBanner();
            const rules = getScheduleRules();
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            products.forEach(p => {
                if (category === 'all' || p.category === category) {
                    let isDrink = DRINK_CATEGORIES.includes(p.category);
                    let isKitchenBlocked = !isDrink && rules.isKitchenClosedForToday;
                    let isStopped = stopList.has(p.id);
                    let isDisabled = isKitchenBlocked || isStopped;

                    let minPrice = p.variants[0].price;
                    let priceLabel = p.variants.length > 1 ? `от ${minPrice} ₽` : `${minPrice} ₽`;
                    let sizesHint = p.variants[0].size ? p.variants.map(v => v.size).join(' / ') : (p.desc || '');
                    
                    let inCartCount = getProductCartCount(p.id);
                    let btnText = inCartCount > 0 ? `Выбрано: ${inCartCount}` : 'Выбрать';
                    let btnClass = inCartCount > 0 ? 'open-btn in-cart' : 'open-btn';

                    if (isStopped) {
                        btnText = 'Закончилось';
                        btnClass = 'open-btn disabled-btn';
                    } else if (isKitchenBlocked) {
                        btnText = `До ${formatMinToHHMM(rules.kitchenClose)}`;
                        btnClass = 'open-btn disabled-btn';
                    }

                    container.innerHTML += `
                        <div class="item ${isDisabled ? 'disabled-item' : ''}" onclick="openProductModal('${p.id}')">
                            <img src="images/${p.id}.jpg" onerror="this.onerror=null; this.src='${p.img}';">
                            <div class="item-info">
                                <span class="item-title">${escapeHtml(p.title)}</span>
                                <span class="item-desc">${escapeHtml(sizesHint)}</span>
                                <span class="item-price">${priceLabel}</span>
                            </div>
                            <button class="${btnClass}">${btnText}</button>
                        </div>
                    `;
                }
            });
        }

        function openProductModal(prodId) {
            let p = products.find(item => item.id === prodId);
            if (!p) return;
            if (stopList.has(p.id)) {
                tg.showAlert(`«${p.title}» сейчас временно закончилась.`);
                return;
            }

            let isDrink = DRINK_CATEGORIES.includes(p.category);
            let rules = getScheduleRules();

            if (!isDrink && rules.isKitchenClosedForToday) {
                tg.showAlert(`Кухня сегодня работала до ${formatMinToHHMM(rules.kitchenClose)}. Сейчас можно заказать только напитки!`);
                return;
            }

            modalState = {
                prodId: p.id,
                varIdx: 0,
                milk: 'Обычное',
                syrup: 'Без сиропа',
                bumbleSyrup: 'С сиропом',
                temp: 'Со льдом',
                cinnamon: false,
                sugar: 0,
                eggType: 'Глазунья',
                addons: []

        function closeModal() {
            document.getElementById('product-modal').classList.remove('active');
            modalState = null;
        }

        function closeModalOnBg(event) {
            if (event.target.id === 'product-modal') closeModal();
        }

        function isCurrentModalInFavorites() {
            if (!modalState) return false;
            let built = buildItemFromConfig(modalState);
            if (!built) return false;
            return userFavorites.some(f => {
                let b = buildItemFromConfig(f.config);
                return b && b.title === built.title;
            });
        }

        function toggleFavoriteFromModal() {
            if (!modalState) return;
            let built = buildItemFromConfig(modalState);
            if (!built) return;

            let idx = userFavorites.findIndex(f => {
                let b = buildItemFromConfig(f.config);
                return b && b.title === built.title;
            });
            if (idx >= 0) {
                userFavorites.splice(idx, 1);
            } else {
                userFavorites.unshift({ config: built.config });
            }
            saveFavoritesData();
            renderModalContent();
        }

        function toggleModalAddon(addonName) {
            if (!modalState) return;
            let idx = modalState.addons.indexOf(addonName);
            if (idx >= 0) {
                modalState.addons.splice(idx, 1);
            } else {
                modalState.addons.push(addonName);
            }
            renderModalContent();
        }

                    return `<button class="chip ${modalState.milk === m ? 'active' : ''}" onclick="setModalProp('milk', '${m}')">${escapeHtml(label)}</button>`;
                }).join('');
                html += `<div class="mod-section"><span class="mod-title">Молоко (200 мл)</span><div class="chips">${btns}</div></div>`;
            }

            if (HAS_SYRUP_LIST.includes(p.id)) {
                let opts = SYRUPS_LIST.map(s => {
                    let label = s === 'Без сиропа' ? s : `${s} (+${SYRUP_PRICE} ₽)`;
                    return `<option value="${escapeHtml(s)}" ${modalState.syrup === s ? 'selected' : ''}>${escapeHtml(label)}</option>`;
                }).join('');
                html += `
                    <div class="mod-section">

                    `<button class="chip ${modalState.bumbleSyrup === s ? 'active' : ''}" onclick="setModalProp('bumbleSyrup', '${s}')">${s}</button>`
                ).join('');
                html += `<div class="mod-section"><span class="mod-title">Сироп</span><div class="chips">${sBtns}</div></div>`;

                let tBtns = ['Горячий', 'Со льдом', 'Без льда'].map(t =>

                ).join('');
                html += `<div class="mod-section"><span class="mod-title">Температура</span><div class="chips">${tBtns}</div></div>`;

        function addBuiltItemToCart(built, countToAdd = 1, shouldSave = true) {
            const n = Number(countToAdd);
            if (!Number.isInteger(n) || n < 1) return;
            let cartKey = `${built.prodId}_${built.title}`;
            if (!cart[cartKey]) {
                cart[cartKey] = {
                    prodId: built.prodId,
                    title: built.title,
                    price: built.price,
                    count: 0,
                    isDrink: built.isDrink,
                    config: built.config
                };
            }
            cart[cartKey].count = Math.min(50, cart[cartKey].count + n);
            if (shouldSave) saveCartData();
        }

                    `;
                });
                favBox.innerHTML = favHtml || `<div class="empty-hint">Избранное пусто</div>`;
            }
        }

        function renderHistoryList() {
            const histBox = document.getElementById('profile-history-list');
            if (!userHistory || userHistory.length === 0) {
                histBox.innerHTML = `<div class="empty-hint">Здесь появится история ваших оплаченных заказов, чтобы их можно было повторить в один клик</div>`;
            } else {
                let histHtml = '';
                userHistory.forEach((hOrder, idx) => {
                    let lines = (hOrder.items || []).map(it => {
                        let b = buildItemFromConfig(it.config);
                        let t = b ? b.title : (it.title || 'Позиция');
                        const cnt = Number(it.count);
                        return `• ${escapeHtml(t)} × ${Number.isInteger(cnt) && cnt > 0 ? cnt : 1}`;
                    }).join('<br>');

                    histHtml += `
                        <div class="profile-card">
                            <div class="profile-card-header">
                                <span>📅 ${escapeHtml(hOrder.date)}</span>
                                <strong>${Number(hOrder.total) || 0} ₽</strong>
                            </div>
                            <div class="profile-card-body">${lines}</div>
                            <div class="profile-card-actions" style="justify-content: flex-end;">
                                <button class="action-small-btn" onclick="repeatOrderFromHistory(${idx})">🔄 Повторить заказ</button>
                            </div>
                        </div>
                    `;
                });
                histBox.innerHTML = histHtml;
            }
        }

        function removeFavorite(idx) {
            userFavorites.splice(idx, 1);
            saveFavoritesData();
            renderFavoritesList();
        }

        function addFavoriteToCart(idx) {
            let fav = userFavorites[idx];
            if (!fav) return;
            let built = buildItemFromConfig(fav.config);
            if (!built) return;

            if (stopList.has(built.prodId)) {
                tg.showAlert(`«${built.title}» сейчас временно закончилась.`);
                return;
            }

            let rules = getScheduleRules();
            if (!built.isDrink && rules.isKitchenClosedForToday) {
                tg.showAlert(`Кухня сегодня работала до ${formatMinToHHMM(rules.kitchenClose)}. Эту позицию сейчас нельзя добавить в заказ.`);
                return;
            }

            addBuiltItemToCart(built, 1);
            updateMainButton();
            renderItems(currentCategory);
            tg.showAlert(`«${built.title}» добавлен в корзину!`);
        }

        function repeatOrderFromHistory(idx) {
            let hOrder = userHistory[idx];
            if (!hOrder || !Array.isArray(hOrder.items)) return;

            let rules = getScheduleRules();
            let addedCount = 0;
            let skippedKitchen = false;
            let skippedStop = false;

            hOrder.items.forEach(it => {
                const n = Number(it && it.count);
                if (!Number.isInteger(n) || n < 1 || n > 50) return;
                let built = buildItemFromConfig(it.config);
                if (!built) return;
                if (stopList.has(built.prodId)) {
                    skippedStop = true;
                    return;
                }
                if (!built.isDrink && rules.isKitchenClosedForToday) {
                    skippedKitchen = true;
                    return;
                }
                addBuiltItemToCart(built, n);
                addedCount += n;
            });

            if (addedCount === 0) {
                if (skippedStop) {
                    tg.showAlert('Позиции из этого заказа сейчас в стоп-листе.');
                } else if (skippedKitchen) {
                    tg.showAlert(`Кухня работает до ${formatMinToHHMM(rules.kitchenClose)}, поэтому блюда из этого заказа сейчас недоступны.`);
                }
                return;
            }

            if (skippedStop || skippedKitchen) {
                tg.showAlert('Доступные позиции добавлены в корзину. Часть позиций пропущена (стоп-лист или часы работы кухни).');
            }

            showScreen('checkout');
            renderCheckoutCart();
            buildTimeSlots();
        }

        function recordPaidOrderToHistory() {
            const st = getSaratovTime();
            const d = st.dateObj;
            const dateStr = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')} в ${formatMinToHHMM(st.totalMinutes)}`;
            
            let total = 0;
            let savedItems = [];
            for (let key in cart) {
                let item = cart[key];
                total += item.price * item.count;
                savedItems.push({
                    count: item.count,
                    config: item.config
                });
            }

            userHistory.unshift({
                date: dateStr,
                total: total,
                items: savedItems
            });
            saveHistoryData();
        }

        function changeCartItemByIdx(idx, delta) {
            let key = cartKeysList[idx];
            if (!key || !cart[key]) return;
            cart[key].count += delta;
            if (cart[key].count <= 0) delete cart[key];
            saveCartData();
            
            renderCheckoutCart();
            buildTimeSlots();
            updateMainButton();
            renderItems(currentCategory);
        }

        function renderCheckoutCart() {
            cartKeysList = Object.keys(cart);
            let cartHtml = '';
            let total = 0;
            cartKeysList.forEach((key, idx) => {
                let item = cart[key];
                let sum = item.price * item.count;
                total += sum;
                let stopBadge = stopList.has(item.prodId)
                    ? `<br><span class="cart-stop-warn">⚠️ Закончилось — удалите из корзины</span>`
                    : '';
                cartHtml += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <span class="cart-item-title">${escapeHtml(item.title)}</span>
                            <span class="cart-item-price">${item.price} ₽ × ${item.count} = ${sum} ₽</span>
                            ${stopBadge}
                        </div>
                        <div class="controls">
                            <button class="ctrl-btn" onclick="changeCartItemByIdx(${idx}, -1)">-</button>
                            <span class="item-count">${item.count}</span>
                            <button class="ctrl-btn plus" onclick="changeCartItemByIdx(${idx}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            cartHtml += `<p style="font-size: 18px; margin-top: 15px;"><strong>Итого: ${total} ₽</strong></p>`;
            document.getElementById('cart-list').innerHTML = cartHtml;
        }

        function updateMainButton() {
            let total = 0;
            let count = 0;
            for (let key in cart) {
                total += cart[key].price * cart[key].count;
                count += cart[key].count;
            }

            if (total > 0) {
                let prep = calculateOrderPrepTime();
                if (currentView === 'checkout') {
                    tg.MainButton.setText(`Оплатить • ${total} ₽`);
                } else {
                    tg.MainButton.setText(`Корзина (${count}) • ~${prep.label} • ${total} ₽`);
                }
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
                if (currentView === 'checkout') backToMenu();
            }
        }

        function backToMenu() {
            showScreen('menu');
            fetchStopList();
            renderItems(currentCategory);
        }

        async function processOrderPayment() {
            if (isSubmittingOrder) return;

            const statusBox = document.getElementById('debug-status');
            statusBox.innerText = '';

            for (let key in cart) {
                if (stopList.has(cart[key].prodId)) {
                    statusBox.innerText = `❌ Позиция «${cart[key].title}» сейчас закончилась. Удалите её из корзины.`;
                    return;
                }
            }

            const targetHHMM = document.getElementById('ready-time-select').value;
            if (!targetHHMM) {
                tg.showAlert('В данный момент невозможно оформить этот заказ (проверьте часы работы кухни и кофейни).');
                return;
            }

            let orderData = {
                items: cart,
                target_hhmm: targetHHMM
            };

            isSubmittingOrder = true;
            tg.MainButton.disable();
            tg.MainButton.showProgress();

            try {
                let response = await fetch(`${BACKEND_URL}/create_order`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': tg.initData || ''
                    },
                    body: JSON.stringify(orderData)
                });
                let resData = await response.json();
                tg.MainButton.hideProgress();
                tg.MainButton.enable();
                isSubmittingOrder = false;

                if (resData.ok && resData.invoice_link) {
                    tg.openInvoice(resData.invoice_link, function(status) {
                        if (status === 'paid') {
                            recordPaidOrderToHistory();
                            cart = {};
                            saveCartData();
                            tg.close();
                        }
                    });
                } else {
                    statusBox.innerText = '❌ ' + (resData.error || 'Неизвестная ошибка');
                }
            } catch (err) {
                tg.MainButton.hideProgress();
                tg.MainButton.enable();
                isSubmittingOrder = false;
                statusBox.innerText = `❌ Нет связи с сервером оплаты.\nДетали: ${err.message}`;
            }
        }

        tg.MainButton.onClick(() => {
            if (currentView !== 'checkout') {
                closeModal();
                showScreen('checkout');
                fetchStopList();
                renderCheckoutCart();
                buildTimeSlots();
            } else {
                processOrderPayment();
            }
        });

        loadStorageData();
        renderItems('all');
        updateMainButton();
        fetchStopList();
        fetchActiveOrderStatus();
    </script>
</body>
</html>
