<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calido Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
            --safe-bottom: calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px));
        }

        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: calc(15px + var(--safe-top)) 15px calc(90px + var(--safe-bottom)) 15px;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Шапка с приветствием и круглыми кнопками вида / профиля */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }
        .top-bar h2 {
            margin: 0;
            font-size: 19px;
            line-height: 1.2;
            min-width: 0;
            flex: 1 1 auto;
        }
        @media (max-width: 375px) {
            .top-bar h2 {
                font-size: 17px;
            }
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .top-circle-btn {
            position: relative;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: 1px solid rgba(128, 128, 128, 0.16);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .top-circle-btn svg {
            width: 17px;
            height: 17px;
            display: block;
        }

        /* Деликатный градиентный контур от серого к чёрному для тёмной темы / AMOLED */
        @media (prefers-color-scheme: dark) {
            .top-circle-btn {
                border: none;
                background:
                    linear-gradient(var(--tg-theme-secondary-bg-color, #181818), var(--tg-theme-secondary-bg-color, #181818)) padding-box,
                    linear-gradient(145deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.07) 48%, rgba(0, 0, 0, 0.9) 100%) border-box;
                border: 1px solid transparent;
            }
        }
        
        /* Информационная плашка о работе кухни и кофейни */
        .schedule-banner {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-hint-color, #666);
            font-size: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            line-height: 1.4;
            border-left: 4px solid #3e2723;
        }
        .schedule-banner strong { color: var(--tg-theme-text-color, #000); }
        .schedule-banner.closed-alert {
            border-left-color: #d32f2f;
            background-color: rgba(211, 47, 47, 0.08);
            color: #d32f2f;
        }

        /* Живая плашка активного заказа */
        .live-order-card {
            background-color: rgba(62, 39, 35, 0.08);
            border: 1px solid #3e2723;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
            cursor: pointer;
        }
        .live-order-card.ready {
            background-color: rgba(46, 125, 50, 0.12);
            border-color: #2e7d32;
        }
        .live-order-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            display: block;
        }
        .live-order-sub {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
            display: block;
        }

        /* Зафиксированная горизонтальная лента разделов с динамическим затуханием */
        .categories-wrap {
            position: sticky;
            top: var(--safe-top);
            z-index: 1000;
            background-color: var(--tg-theme-bg-color, #ffffff);
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        .categories-wrap::before,
        .categories-wrap::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 24px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.18s ease;
            z-index: 2;
        }
        .categories-wrap::before {
            left: 0;
            background: linear-gradient(to left, rgba(255, 255, 255, 0), var(--tg-theme-bg-color, #ffffff));
        }
        .categories-wrap::after {
            right: 0;
            background: linear-gradient(to right, rgba(255, 255, 255, 0), var(--tg-theme-bg-color, #ffffff));
        }
        .categories-wrap.can-scroll-left::before {
            opacity: 1;
        }
        .categories-wrap.can-scroll-right::after {
            opacity: 1;
        }
        .categories {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 10px 24px 10px 0;
            -webkit-overflow-scrolling: touch;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .cat-btn.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Контейнер меню: сетка 2 в ряд по умолчанию */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .items-list {
            display: block;
        }

        /* Карточки товаров в сетке (2 в ряд) */
        .grid-card {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            box-sizing: border-box;
        }
        .grid-card.disabled-item {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .grid-card img {
            width: 100%;
            aspect-ratio: 4 / 3;
            height: auto;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 8px;
            display: block;
        }
        .grid-card-title {
            font-weight: bold;
            font-size: 14px;
            line-height: 1.25;
            margin-bottom: 3px;
            display: block;
        }
        .grid-card-desc {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 6px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .grid-card-price {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }
        .grid-open-btn {
            width: 100%;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
        }
        .grid-open-btn.in-cart {
            background-color: #3e2723;
            color: #ffffff;
        }
        .grid-open-btn.disabled-btn {
            background-color: rgba(128, 128, 128, 0.2);
            color: var(--tg-theme-hint-color, #888888);
            font-weight: 500;
        }

        /* Карточки товаров в списке */
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
            cursor: pointer;
        }
        .item.disabled-item {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .item img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .item-info { flex-grow: 1; padding-right: 10px; min-width: 0; }
        .item-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: block; }
        .item-desc { font-size: 12px; color: var(--tg-theme-hint-color, #888); margin-bottom: 6px; display: block; }
        .item-price { font-weight: 600; font-size: 15px; display: block; }
        
        .open-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 18px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .open-btn.in-cart {
            background-color: #3e2723;
            color: #ffffff;
        }
        .open-btn.disabled-btn {
            background-color: #e0e0e0;
            color: #888888;
            font-weight: 500;
            font-size: 12px;
        }

        /* Модальное окно карточки товара (шторка снизу) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1001;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            width: 100%;
            max-height: 88vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            box-sizing: border-box;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: rgba(0, 0, 0, 0.55);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(6px);
        }
        .modal-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 12px;
        }
        .modal-title { font-size: 20px; font-weight: bold; margin: 0 0 6px 0; }
        .modal-desc { font-size: 13px; color: var(--tg-theme-hint-color, #777); margin-bottom: 10px; line-height: 1.4; }
        
        .kbju-box {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .kbju-box strong { color: var(--tg-theme-text-color, #000); }

        /* Секции модификаторов в карточке */
        .mod-section { margin-bottom: 16px; }
        .mod-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .chip.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        .mod-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .mod-row-title { font-size: 14px; font-weight: 600; }
        .mod-row-sub { font-size: 11px; color: var(--tg-theme-hint-color, #888); display: block; }

        /* Кнопки плюс и минус */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ctrl-btn {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000);
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn.plus {
            background-color: #3e2723;
            color: #ffffff;
            border-color: #3e2723;
        }
        .item-count {
            font-weight: bold;
            font-size: 15px;
            min-width: 18px;
            text-align: center;
        }

        /* Нижний ряд кнопок в модалке: Избранное + В корзину */
        .modal-actions-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .fav-toggle-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 12px;
            width: 52px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .add-modal-btn {
            flex-grow: 1;
            background-color: #3e2723;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Экраны */
        #checkout, #profile, #profile-favs, #profile-history { display: none; }

        .checkout-block {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            font-size: 15px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .prep-time-hint {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #666);
            margin-top: 8px;
            display: block;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--tg-theme-link-color, #3390ec);
            font-size: 16px;
            padding: 0;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
        }
        .cart-item-info { flex-grow: 1; padding-right: 10px; }
        .cart-item-title { font-size: 14px; font-weight: 600; display: block; margin-bottom: 3px; }
        .cart-item-price { font-size: 13px; color: var(--tg-theme-hint-color, #777); }
        .cart-stop-warn {
            display: inline-block;
            margin-top: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #d32f2f;
        }

        /* Элементы Личного кабинета */
        .profile-section-title {
            font-size: 16px;
            font-weight: bold;
            margin: 18px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .profile-menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .profile-nav-btn {
            width: 100%;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 14px;
            padding: 15px 16px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-align: left;
            box-sizing: border-box;
        }
        .profile-nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--tg-theme-hint-color, #888);
            font-size: 14px;
            font-weight: 500;
        }
        .profile-tips-btn {
            width: 100%;
            background-color: #3e2723;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 15px 16px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-top: 18px;
            box-sizing: border-box;
        }
        .reviews-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .review-btn {
            flex: 1;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 12px;
            padding: 11px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Карточки внутри Избранного и Истории */
        .profile-card {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .fav-card {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .fav-card img {
            width: 68px;
            height: 68px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .fav-card-content {
            flex-grow: 1;
            min-width: 0;
        }
        .profile-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #777);
        }
        .profile-card-body {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .profile-card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .action-small-btn {
            background-color: #3e2723;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .remove-small-btn {
            background: none;
            border: none;
            color: #d32f2f;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 6px;
        }
        .empty-hint {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
        }
        
        #debug-status {
            margin-top: 12px;
            font-size: 13px;
            color: #d32f2f;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    
    <!-- Экран меню -->
    <div id="menu">
        <div class="top-bar">
            <h2 id="greeting">Привет! 👋</h2>
            <div class="top-actions">
                <button id="view-toggle-btn" class="top-circle-btn" onclick="toggleMenuViewMode()" title="Переключить вид"></button>
                <button class="top-circle-btn" onclick="openProfile()" title="Профиль">👤</button>
            </div>
        </div>

        <div id="schedule-info" class="schedule-banner"></div>
        
        <!-- Плашка живого статуса заказа прямо на главной -->
        <div id="menu-live-order" style="display: none;" onclick="openProfile()"></div>
        
        <div id="categories-wrap" class="categories-wrap">
            <div id="categories-bar" class="categories">
                <button class="cat-btn active" onclick="filter('seasonal', event)">🍁 Сезонное меню</button>
                <button class="cat-btn" onclick="filter('milk', event)">С молоком</button>
                <button class="cat-btn" onclick="filter('black', event)">Черный</button>
                <button class="cat-btn" onclick="filter('not-coffee', event)">Не кофе</button>
                <button class="cat-btn" onclick="filter('hearty-bf', event)">Сытные завтраки</button>
                <button class="cat-btn" onclick="filter('sweet-bf', event)">Сладкие завтраки</button>
                <button class="cat-btn" onclick="filter('pasta', event)">Паста</button>
                <button class="cat-btn" onclick="filter('salads', event)">Салаты</button>
            </div>
        </div>

        <div id="items-container" class="items-grid"></div>
    </div>

    <!-- Экран Личного кабинета -->
    <div id="profile">
        <button class="back-btn" onclick="backToMenu()">← Назад в меню</button>
        <h2 id="profile-user-title" style="margin-top: 0;">Личный кабинет</h2>

        <div class="profile-section-title">📡 Активный заказ</div>
        <div id="profile-active-order"></div>

        <div class="profile-menu-list">
            <button class="profile-nav-btn" onclick="openFavoritesPage()">
                <span class="profile-nav-left">❤️ Избранное</span>
                <span class="profile-nav-right"><span id="favs-count-badge">0</span> ›</span>
            </button>
            <button class="profile-nav-btn" onclick="openHistoryPage()">
                <span class="profile-nav-left">🕒 Мои заказы</span>
                <span class="profile-nav-right"><span id="hist-count-badge">0</span> ›</span>
            </button>
        </div>
