<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calido Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 20px;
        }
        .item {
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }
        /* Вот тут мы настроили внешний вид картинок */
        .item img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
        }
        .item-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .item-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .item-desc {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999);
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>☕️ Calido coffee</h1>
    <div class="subtitle">Выбери свой напиток</div>

    <div class="item">
        <!-- Ссылка на фото внутри тега img -->
        <img src="https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=200&q=80" alt="Капучино">
        <div class="item-info">
            <span class="item-title">Капучино</span>
            <span class="item-desc">300 мл</span>
        </div>
        <button onclick="order('Капучино')">Взять</button>
    </div>
    
    <div class="item">
        <img src="https://images.unsplash.com/photo-1559525839-b184a4d698c7?w=200&q=80" alt="Латте">
        <div class="item-info">
            <span class="item-title">Латте</span>
            <span class="item-desc">400 мл</span>
        </div>
        <button onclick="order('Латте')">Взять</button>
    </div>
    
    <div class="item">
        <img src="https://images.unsplash.com/photo-1557006021-b85faa2bc5e2?w=200&q=80" alt="Флэт Уайт">
        <div class="item-info">
            <span class="item-title">Флэт Уайт</span>
            <span class="item-desc">Крепкий малый</span>
        </div>
        <button onclick="order('Флэт Уайт')">Взять</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function order(item) {
            tg.sendData(item);
            tg.close();
        }
    </script>
</body>
</html>
