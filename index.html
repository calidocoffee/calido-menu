<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calido Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 80px; /* Отступ для кнопки ТГ */
        }
        h2 { margin-top: 0; font-size: 22px; }
        
        /* Стили категорий */
        .categories {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
        }
        .cat-btn.active {
            background-color: #3e2723; /* Кофейный цвет из макета */
            color: white;
        }

        /* Стили товаров */
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
        }
        .item img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 15px;
        }
        .item-info { flex-grow: 1; }
        .item-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; display: block;}
        .item-price { color: var(--tg-theme-hint-color, #777); font-size: 14px; }
        .add-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 20px;
            line-height: 20px;
            cursor: pointer;
        }

        /* Экран оформления заказа */
        #checkout { display: none; }
        .checkout-block {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    
    <!-- Главный экран меню -->
    <div id="menu">
        <h2>Привет, Евгений! 👋</h2>
        
        <div class="categories">
            <button class="cat-btn active" onclick="filter('all')">Все</button>
            <button class="cat-btn" onclick="filter('coffee')">Кофе</button>
            <button class="cat-btn" onclick="filter('not-coffee')">Не кофе</button>
            <button class="cat-btn" onclick="filter('food')">Еда</button>
        </div>

        <div id="items-container">
            <!-- Сюда JS будет подгружать товары -->
        </div>
    </div>

    <!-- Экран оформления заказа -->
    <div id="checkout">
        <h2>Оформление заказа</h2>
        
        <div class="checkout-block">
            <strong>Способ получения:</strong><br>
            Самовывоз<br>
            <small style="color: #777;">Саратов, ул. Рабочая, 49</small>
        </div>

        <div class="checkout-block">
            <strong>Способ оплаты:</strong>
            <select id="payment-method">
                <option value="Наличными при получении">Наличными при получении</option>
                <option value="Картой при получении">Картой (терминал) при получении</option>
                <option value="Картой онлайн">Картой онлайн (перевод)</option>
            </select>
        </div>
        
        <h3>Ваш заказ:</h3>
        <div id="cart-list"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // База товаров
        const products = [
            { id: 1, title: 'Капучино 300 мл', price: 180, category: 'coffee', img: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=200&q=80' },
            { id: 2, title: 'Раф фисташковый', price: 250, category: 'coffee', img: 'https://images.unsplash.com/photo-1559525839-b184a4d698c7?w=200&q=80' },
            { id: 3, title: 'Матча Латте', price: 220, category: 'not-coffee', img: 'https://images.unsplash.com/photo-1515823662972-da6a2e4d3002?w=200&q=80' },
            { id: 4, title: 'Чизкейк Сан-Себастьян', price: 250, category: 'food', img: 'https://images.unsplash.com/photo-1533134242443-d4fd01530ae1?w=200&q=80' }
        ];

        let cart = {}; // Корзина
        let currentView = 'menu'; 

        // Отрисовка товаров
        function renderItems(category) {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            products.forEach(p => {
                if (category === 'all' || p.category === category) {
                    let count = cart[p.id] ? cart[p.id].count : 0;
                    container.innerHTML += `
                        <div class="item">
                            <img src="${p.img}">
                            <div class="item-info">
                                <span class="item-title">${p.title}</span>
                                <span class="item-price">${p.price} ₽</span>
                            </div>
                            <button class="add-btn" onclick="addToCart(${p.id})">${count > 0 ? count : '+'}</button>
                        </div>
                    `;
                }
            });
        }

        // Логика категорий
        function filter(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderItems(category);
        }

        // Добавление в корзину
        function addToCart(id) {
            let product = products.find(p => p.id === id);
            if (!cart[id]) cart[id] = { ...product, count: 0 };
            cart[id].count++;
            
            updateMainButton();
            renderItems(document.querySelector('.cat-btn.active').getAttribute('onclick').match(/'([^']+)'/)[1]);
        }

        // Обновление нижней кнопки Телеграма
        function updateMainButton() {
            let total = 0;
            let count = 0;
            for (let id in cart) {
                total += cart[id].price * cart[id].count;
                count += cart[id].count;
            }

            if (total > 0) {
                tg.MainButton.setText(`Корзина (${count} шт) • ${total} ₽`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // Клик по нижней кнопке ТГ
        tg.MainButton.onClick(() => {
            if (currentView === 'menu') {
                // Переход к оформлению
                document.getElementById('menu').style.display = 'none';
                document.getElementById('checkout').style.display = 'block';
                currentView = 'checkout';
                
                // Рендер корзины
                let cartHtml = '';
                let total = 0;
                for (let id in cart) {
                    cartHtml += `<p>${cart[id].title} x ${cart[id].count} = ${cart[id].price * cart[id].count} ₽</p>`;
                    total += cart[id].price * cart[id].count;
                }
                cartHtml += `<strong>Итого: ${total} ₽</strong>`;
                document.getElementById('cart-list').innerHTML = cartHtml;

                tg.MainButton.setText('Подтвердить заказ');
            } else {
                // Отправка заказа в бота
                let orderData = {
                    items: cart,
                    payment: document.getElementById('payment-method').value,
                    type: 'pickup'
                };
                tg.sendData(JSON.stringify(orderData));
                tg.close();
            }
        });

        // Инициализация
        renderItems('all');
    </script>
</body>
</html>
