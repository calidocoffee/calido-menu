<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calido Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }
        h2 { margin-top: 0; font-size: 22px; margin-bottom: 15px; }
        
        /* Горизонтальная лента разделов */
        .categories {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Карточки товаров */
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
        }
        .item img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .item-info { flex-grow: 1; padding-right: 10px; }
        .item-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: block; }
        .item-desc { font-size: 12px; color: var(--tg-theme-hint-color, #888); margin-bottom: 6px; display: block; }
        .item-price { font-weight: 600; font-size: 14px; }
        
        /* Кнопки плюс и минус */
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ctrl-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn.plus {
            background-color: #3e2723;
            color: #ffffff;
        }
        .item-count {
            font-weight: bold;
            font-size: 15px;
            min-width: 16px;
            text-align: center;
        }

        /* Экран оформления */
        #checkout { display: none; }
        .checkout-block {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            font-size: 16px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--tg-theme-link-color, #3390ec);
            font-size: 16px;
            padding: 0;
            margin-bottom: 15px;
            cursor: pointer;
        }
    </style>
</head>

            <button class="cat-btn" onclick="filter('milk', event)">С молоком</button>

            <button class="cat-btn" onclick="filter('not-coffee', event)">Не кофе</button>

            <button class="cat-btn" onclick="filter('sweet-bf', event)">Сладкие завтраки</button>
            <button class="cat-btn" onclick="filter('pasta', event)">Паста</button>
            <button class="cat-btn" onclick="filter('salads', event)">Салаты</button>
        </div>

        <div id="items-container"></div>
    </div>

    <!-- Экран оформления заказа -->

        ];

        let cart = {};
        let currentView = 'menu';
        let currentCategory = 'all';

        function renderItems(category) {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            products.forEach(p => {
                if (category === 'all' || p.category === category) {
                    let count = cart[p.id] ? cart[p.id].count : 0;
                    
                    let controlsHtml = count > 0 
                        ? `<div class="controls">
                             <button class="ctrl-btn" onclick="changeCount(${p.id}, -1)">-</button>
                             <span class="item-count">${count}</span>
                             <button class="ctrl-btn plus" onclick="changeCount(${p.id}, 1)">+</button>
                           </div>`
                        : `<div class="controls">
                             <button class="ctrl-btn" onclick="changeCount(${p.id}, 1)">+</button>
                           </div>`;

                    container.innerHTML += `
                        <div class="item">
                            <img src="${p.img}">
                            <div class="item-info">
                                <span class="item-title">${p.title}</span>
                                <span class="item-desc">${p.desc}</span>
                                <span class="item-price">${p.price} ₽</span>
                            </div>
                            ${controlsHtml}
                        </div>
                    `;
                }
            });
        }

        function filter(category, event) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderItems(category);
        }

        function changeCount(id, delta) {
            let product = products.find(p => p.id === id);
            if (!cart[id]) cart[id] = { ...product, count: 0 };
            cart[id].count += delta;
            
            if (cart[id].count <= 0) {
                delete cart[id];
            }
            
            updateMainButton();
            renderItems(currentCategory);
        }

        function updateMainButton() {
            let total = 0;
            let count = 0;
            for (let id in cart) {
                total += cart[id].price * cart[id].count;
                count += cart[id].count;
            }

            if (total > 0) {
                if (currentView === 'menu') {
                    tg.MainButton.setText(`Корзина (${count} шт) • ${total} ₽`);
                } else {
                    tg.MainButton.setText(`Подтвердить заказ • ${total} ₽`);
                }
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
                if (currentView === 'checkout') backToMenu();
            }
        }

        function backToMenu() {
            document.getElementById('checkout').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            currentView = 'menu';
            updateMainButton();
        }

        tg.MainButton.onClick(() => {
            if (currentView === 'menu') {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('checkout').style.display = 'block';
                currentView = 'checkout';
                
                let cartHtml = '';
                let total = 0;
                for (let id in cart) {
                    cartHtml += `<p>${cart[id].title} x ${cart[id].count} = ${cart[id].price * cart[id].count} ₽</p>`;
                    total += cart[id].price * cart[id].count;
                }
                cartHtml += `<strong>Итого: ${total} ₽</strong>`;
                document.getElementById('cart-list').innerHTML = cartHtml;

                updateMainButton();
            } else {
                let orderData = {
                    items: cart,
                    payment: document.getElementById('payment-method').value,
                    type: 'pickup'
                };
                tg.sendData(JSON.stringify(orderData));
                tg.close();
            }
        });

        renderItems('all');
    </script>
