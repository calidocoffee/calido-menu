<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calido Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
        }
        h2 { margin-top: 0; font-size: 22px; margin-bottom: 15px; }
        
        /* Зафиксированная горизонтальная лента разделов */
        .categories {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--tg-theme-bg-color, #ffffff);
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 10px 0;
            margin-bottom: 15px;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Карточки товаров в общем списке */
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
            cursor: pointer;
        }
        .item img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .item-info { flex-grow: 1; padding-right: 10px; }
        .item-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; display: block; }
        .item-desc { font-size: 12px; color: var(--tg-theme-hint-color, #888); margin-bottom: 6px; display: block; }
        .item-price { font-weight: 600; font-size: 15px; display: block; }
        
        .open-btn {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 18px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .open-btn.in-cart {
            background-color: #3e2723;
            color: #ffffff;
        }

        /* Модальное окно карточки товара (шторка снизу) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            width: 100%;
            max-height: 88vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }
        .modal-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 12px;
        }
        .modal-title { font-size: 20px; font-weight: bold; margin: 0 0 6px 0; }
        .modal-desc { font-size: 13px; color: var(--tg-theme-hint-color, #777); margin-bottom: 10px; line-height: 1.4; }
        
        .kbju-box {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .kbju-box strong { color: var(--tg-theme-text-color, #000); }

        /* Секции модификаторов в карточке */
        .mod-section { margin-bottom: 16px; }
        .mod-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .chip.active {
            background-color: #3e2723;
            color: #ffffff;
        }

        .mod-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .mod-row-title { font-size: 14px; font-weight: 600; }
        .mod-row-sub { font-size: 11px; color: var(--tg-theme-hint-color, #888); display: block; }

        /* Кнопки плюс и минус */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ctrl-btn {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000);
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn.plus {
            background-color: #3e2723;
            color: #ffffff;
            border-color: #3e2723;
        }
        .item-count {
            font-weight: bold;
            font-size: 15px;
            min-width: 18px;
            text-align: center;
        }

        .add-modal-btn {
            width: 100%;
            background-color: #3e2723;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Экран оформления и корзины */
        #checkout { display: none; }
        .checkout-block {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            font-size: 15px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--tg-theme-link-color, #3390ec);
            font-size: 16px;
            padding: 0;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
        }
        .cart-item-info { flex-grow: 1; padding-right: 10px; }
        .cart-item-title { font-size: 14px; font-weight: 600; display: block; margin-bottom: 3px; }
        .cart-item-price { font-size: 13px; color: var(--tg-theme-hint-color, #777); }
    </style>
</head>

    <!-- Экран меню -->

        <div class="categories">

        </div>

        <div id="items-container"></div>
    </div>

    <!-- Модальная карточка товара с модификаторами -->

        <div class="checkout-block">

            </select>
        </div>
        
        <h3>Ваш заказ:</h3>
        <div id="cart-list"></div>
